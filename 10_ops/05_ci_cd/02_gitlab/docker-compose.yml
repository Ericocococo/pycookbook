services:
  gitlab:
    image: gitlab/gitlab-ce:latest       # CE = Community Edition（免费开源版）
    container_name: gitlab
    hostname: gitlab.example.com         # 影响克隆地址，改成你的域名或 IP
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.example.com'   # 对外访问地址，决定克隆 URL 的前缀
        gitlab_rails['time_zone'] = 'Asia/Shanghai'
        # 关闭不需要的功能（节省内存）
        # gitlab_rails['gitlab_email_enabled'] = false
    ports:
      - "80:80"                          # HTTP
      - "443:443"                        # HTTPS
      - "2222:22"                        # SSH（避开宿主机 22 端口）
    volumes:
      - gitlab_config:/etc/gitlab        # GitLab 配置文件
      - gitlab_logs:/var/log/gitlab      # 日志
      - gitlab_data:/var/opt/gitlab      # 数据（仓库、数据库等）
    restart: unless-stopped
    shm_size: '256m'                     # 共享内存，GitLab 需要较大共享内存

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
