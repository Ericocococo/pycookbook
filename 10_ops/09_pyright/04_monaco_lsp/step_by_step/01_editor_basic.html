<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>① 最小 Monaco 编辑器</title>
    <!--
      第一步：只加载 Monaco，显示一个能编辑的代码框。
      不连后端，不做语法高亮，就是最简单的文本编辑器。

      学到：
        - require.config 配置 CDN 路径
        - require(['vs/editor/editor.main']) 加载 Monaco
        - monaco.editor.create() 创建编辑器实例
        - 三个必填参数：容器 DOM、初始内容 value、语言 language
    -->
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
        }

        #editor {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="editor"></div>

<!-- CDN 加载 Monaco 的模块加载器（只是 loader，不是整个编辑器） -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>

    // 告诉 loader 去哪里找 Monaco 的模块文件
    require.config({
        paths: {vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs'}
    });

    // 加载完成后，monaco 全局对象可用
    require(['vs/editor/editor.main'], function () {

        // 创建编辑器实例，挂载到 #editor 容器
        monaco.editor.create(document.getElementById('editor'), {
            value: 'print("hello world")\n',   // 初始内容
            language: 'python',                 // 语言（此时无高亮规则，只影响缩进等行为）
            theme: 'vs-dark',                   // 深色主题
            fontSize: 14,
            minimap: {enabled: false},        // 关闭右侧缩略图
        });

    });

</script>
</body>
</html>
