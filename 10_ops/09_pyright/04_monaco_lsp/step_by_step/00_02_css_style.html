<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>前置 ② CSS 样式</title>
    <!--
      CSS 控制"长什么样"：颜色、大小、布局、间距。
      HTML 管结构，CSS 管外观，分工明确。

      三种写法（本文件演示前两种）：
        1. <style> 标签（写在 head 里，本文件用这种）
        2. 行内 style 属性（写在标签上，偶尔用）
        3. 外部 .css 文件（大项目用，本系列不涉及）

      选择器（告诉 CSS "给谁加样式"）：
        body { ... }      标签选择器 → 所有 body
        .box  { ... }     类选择器   → class="box" 的元素
        #editor { ... }   ID 选择器  → id="editor" 的元素

      常用属性（Monaco 会用到的）：
        margin / padding         外间距 / 内间距
        width / height           宽高
        background / color       背景色 / 文字色
        border                   边框
        font-size / font-family  字号 / 字体
        display: flex            弹性布局（横向排列）
    -->

    <!-- style 标签：CSS 规则写在这里 -->
    <style>
        /* 重置默认样式（Monaco 的 index.html 第一行就是这个） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1e1e1e; /* 深色背景（VS Code 同款） */
            color: #ccc; /* 浅灰文字 */
            font-family: system-ui; /* 系统默认字体 */
            padding: 20px;
        }

        /* 类选择器：class="header" 的元素 */
        .header {
            background: #252526;
            padding: 10px 16px;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
            display: flex; /* 弹性布局：子元素横向排列 */
            align-items: center; /* 垂直居中 */
            gap: 12px; /* 子元素间距 */
        }

        /* ID 选择器：id="editor-box" 的元素 */
        #editor-box {
            width: 100%;
            height: 200px;
            background: #1e1e1e;
            border: 1px solid #444;
            padding: 12px;
            font-family: monospace; /* 等宽字体（代码用） */
            font-size: 14px;
            color: #9cdcfe;
        }

        /* 状态指示灯（Monaco 里的连接状态就这样做） */
        .status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .connected {
            background: #2d5a2d;
            color: #6fc66f;
        }

        .disconnected {
            background: #5a2d2d;
            color: #c66f6f;
        }

        .note {
            color: #888;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- 模拟 Monaco 的顶栏 -->
<div class="header">
    <h1 style="font-size: 14px; color: #ddd;">CSS 样式演示</h1>
    <span class="status connected">已连接</span>
    <span class="status disconnected">未连接</span>
</div>

<!-- 模拟编辑器区域 -->
<div id="editor-box">
    这里将来会被 Monaco 编辑器替换。<br>
    现在只是一个 div + CSS 画出来的盒子。<br>
    等宽字体 + 深色背景 = 代码编辑器的样子。
</div>

<p class="note">
    对比 01_editor_basic.html 里 Monaco 的 CSS：
    body 全屏深色、#editor 占满剩余高度、minimap 关闭。
    所有视觉效果都是 CSS 控制的。
</p>

</body>
</html>
